<title>광덕고 3D 캠퍼스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed 3D campus; school-green HUD cards pinned to corners; building labels float over the scene */
:root{
  --panel:rgba(255,255,255,.9);--panel-line:rgba(28,48,38,.14);--ink:#1c2a23;--ink-2:#4f6158;
  --accent:#2f7d4f;--accent-ink:#ffffff;--chip:#eef3ef;--label:rgba(24,30,28,.82);--label-ink:#ffffff;--sky:#cfdbe6;
  --f-display:"Do Hyeon","Gothic A1",system-ui,sans-serif;--f-ui:"Gothic A1",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(22,30,27,.88);--panel-line:rgba(220,235,226,.14);--ink:#e8efe9;--ink-2:#a9b8af;--accent:#5fbf86;--accent-ink:#0f1f16;--chip:#2a3832;--label:rgba(14,18,16,.85);--label-ink:#f2f5f3;--sky:#1a2230;color-scheme:dark}}
:root[data-theme="dark"]{--panel:rgba(22,30,27,.88);--panel-line:rgba(220,235,226,.14);--ink:#e8efe9;--ink-2:#a9b8af;--accent:#5fbf86;--accent-ink:#0f1f16;--chip:#2a3832;--label:rgba(14,18,16,.85);--label-ink:#f2f5f3;--sky:#1a2230;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:none}
#app{position:relative;height:100%}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--label);color:var(--label-ink);font:600 12px var(--f-ui);padding:3px 8px;border-radius:4px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lbl::after{content:"";position:absolute;left:50%;bottom:-4px;width:1px;height:4px;background:var(--label)}
#labels.off .lbl,#labels.off .room{display:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px}
.card{pointer-events:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.title{padding:9px 14px 10px}
.title h1{margin:0;font:400 24px/1.15 var(--f-display);letter-spacing:.01em}
.title h1 em{font-style:normal;color:var(--accent)}
.title p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
.tools{padding:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:600 13px var(--f-ui);color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:7px;padding:7px 11px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
@media (min-width:700px){.bottom{flex-wrap:nowrap}}
.views{padding:6px;display:flex;gap:6px;flex-wrap:wrap}
.info{width:min(320px,100%);padding:12px 14px 13px;display:grid;gap:6px}
.info h2{margin:0;font:400 20px var(--f-display);display:flex;align-items:baseline;gap:8px}
.info h2 small{font:600 12px var(--f-ui);color:var(--ink-2)}
.info p{margin:0;font-size:13px;line-height:1.55;color:var(--ink)}
.info .src{font-size:11px;color:var(--ink-2)}
.info .x{justify-self:end;margin-top:-4px}
.floors{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.floors .btn{padding:6px 10px}
.room{position:absolute;left:0;top:0;background:rgba(255,255,255,.92);color:#1c2a23;font:700 11px var(--f-ui);padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;border:1px solid rgba(28,48,38,.18)}
.hint{justify-self:start;font-size:12px;color:var(--ink-2);background:var(--panel);border-radius:6px;padding:3px 8px}
[hidden]{display:none!important}
@media (max-width:560px){.title h1{font-size:20px}.title p{display:none}.btn{padding:6px 9px;font-size:12px}.info{width:100%}}
</style>

<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>
  <div class="hud">
    <div class="top">
      <div class="card title">
        <h1><em>광덕고</em> 3D 캠퍼스</h1>
        <p>광주 서구 화정로 202 · 2023년 평면도 · 위성사진 · 현장 사진 기준</p>
      </div>
      <div class="card tools">
        <button class="btn" id="b-night" type="button" aria-pressed="false">밤</button>
        <button class="btn" id="b-labels" type="button" aria-pressed="true">이름표</button>
        <button class="btn" id="b-spin" type="button" aria-pressed="false">자동 회전</button>
      </div>
    </div>
    <div class="bottom">
      <div style="display:grid;gap:6px;pointer-events:none;flex:1 1 300px;min-width:0;justify-items:start">
        <div class="card views" role="group" aria-label="시점">
          <button class="btn" data-view="all" type="button">전경</button>
          <button class="btn" data-view="top" type="button">위에서</button>
          <button class="btn" data-view="front" type="button">만대관 정면</button>
          <button class="btn" data-view="road" type="button">광장 길</button>
          <button class="btn" data-view="facade" type="button">운동장에서</button>
          <button class="btn" data-view="court" type="button">중정</button>
          <button class="btn" data-view="garden" type="button">정원</button>
          <button class="btn" data-view="gym" type="button">체육관 언덕</button>
          <button class="btn" data-view="field" type="button">운동장</button>
        </div>
        <div class="hint">드래그: 회전 · 우클릭 드래그: 이동 · 휠: 확대 · 건물을 누르면 층별로 안을 볼 수 있어요</div>
      </div>
      <div class="card info" id="info" hidden>
        <button class="btn x" id="info-x" type="button" aria-label="설명 닫기">닫기</button>
        <h2 id="info-name"></h2>
        <p id="info-desc"></p>
        <div class="floors" id="floors" role="group" aria-label="층 선택"></div>
        <p class="src" id="info-src"></p>
      </div>
    </div>
  </div>
</div>

// ---------- plan → geometry generator (shared by the model and the game) ----------
const TW=.3,TP=.15,SLAB=.3,PARA=1.0;
const toW=(b,u,v)=>{switch(b.rot){case'W':return[b.X0+v,b.Z0-u];case'S':return[b.X0-u,b.Z0-v];case'N':return[b.X0+u,b.Z0+v];default:return[b.X0-v,b.Z0+u]}};
const lxOf=b=>b.rot==='S'||b.rot==='N';
const dirW=(b,du,dv)=>{switch(b.rot){case'W':return[dv,-du];case'S':return[-du,-dv];case'N':return[du,dv];default:return[-dv,du]}};
function wRect(b,u0,v0,u1,v1){const[a,c]=toW(b,u0,v0),[d,e]=toW(b,u1,v1);return[Math.min(a,d),Math.min(c,e),Math.max(a,d),Math.max(c,e)]}
const fhOf=(b,f)=>{const a=b.fh||[3.6];return a[Math.min(f-1,a.length-1)]};
const y0Of=(b,f)=>{let y=b.base||0;for(let k=1;k<f;k++)y+=fhOf(b,k);return y};
const floorList=b=>Object.keys(b.floors).map(Number).sort((a,c)=>a-c);
const r3=x=>Math.round(x*1000)/1000;
function grid(lists){const us=new Set(),vs=new Set();lists.forEach(l=>l.forEach(r=>{us.add(r3(r.u0));us.add(r3(r.u1));vs.add(r3(r.v0));vs.add(r3(r.v1))}));
  const U=[...us].sort((a,c)=>a-c),V=[...vs].sort((a,c)=>a-c);return{U,V,nu:U.length-1,nv:V.length-1}}
function cover(g,rooms){const id=new Int32Array(Math.max(0,g.nu*g.nv)).fill(-1);
  rooms.forEach((r,k)=>{for(let j=0;j<g.nv;j++){const vc=(g.V[j]+g.V[j+1])/2;if(vc<r.v0||vc>r.v1)continue;for(let i=0;i<g.nu;i++){const uc=(g.U[i]+g.U[i+1])/2;if(uc>r.u0&&uc<r.u1)id[j*g.nu+i]=k}}});return id}
function rectsOf(g,flag){const out=[],used=new Uint8Array(g.nu*g.nv);
  for(let j=0;j<g.nv;j++)for(let i=0;i<g.nu;i++){const k=j*g.nu+i;if(used[k]||!flag[k])continue;const fv=flag[k];let i1=i;while(i1+1<g.nu&&flag[j*g.nu+i1+1]===fv&&!used[j*g.nu+i1+1])i1++;
    let j1=j;outer:while(j1+1<g.nv){for(let ii=i;ii<=i1;ii++){const kk=(j1+1)*g.nu+ii;if(flag[kk]!==fv||used[kk])break outer}j1++}
    for(let jj=j;jj<=j1;jj++)for(let ii=i;ii<=i1;ii++)used[jj*g.nu+ii]=1;out.push({u0:g.U[i],u1:g.U[i1+1],v0:g.V[j],v1:g.V[j1+1],k:fv})}return out}
// boundary segments of a cell id field
function edges(g,id){const seg=[];
  for(let i=0;i<=g.nu;i++)for(let j=0;j<g.nv;j++){const a=i>0?id[j*g.nu+i-1]:-1,c=i<g.nu?id[j*g.nu+i]:-1;if(a!==c)seg.push({ax:'u',at:g.U[i],s0:g.V[j],s1:g.V[j+1],a,c})}
  for(let j=0;j<=g.nv;j++)for(let i=0;i<g.nu;i++){const a=j>0?id[(j-1)*g.nu+i]:-1,c=j<g.nv?id[j*g.nu+i]:-1;if(a!==c)seg.push({ax:'v',at:g.V[j],s0:g.U[i],s1:g.U[i+1],a,c})}
  return seg}
function merge(seg,keyOf){const m=new Map();seg.forEach(s=>{const k=s.ax+'|'+s.at+'|'+keyOf(s);if(!m.has(k))m.set(k,[]);m.get(k).push(s)});const out=[];
  m.forEach(l=>{l.sort((a,c)=>a.s0-c.s0);let cur=null;l.forEach(s=>{if(cur&&Math.abs(cur.s1-s.s0)<1e-6)cur.s1=s.s1;else{if(cur)out.push(cur);cur={...s}}});if(cur)out.push(cur)});return out}
const OPEN=t=>t==='hall'||t==='conn';
const DOORISH=t=>t==='hall'||t==='conn'||t==='stair';
// local box → world box
function lbox(b,u0,u1,v0,v1,y0,y1){const[x0,z0,x1,z1]=wRect(b,u0,v0,u1,v1);return{x:(x0+x1)/2,z:(z0+z1)/2,y:(y0+y1)/2,sx:x1-x0,sz:z1-z0,sy:y1-y0}}
function splitLen(a,b,step){const n=Math.max(1,Math.round((b-a)/step));return Array.from({length:n+1},(_,i)=>a+(b-a)*i/n)}
function extStyle(b,f,t,r){if(b.gym)return'gym';if(b.bigWin&&b.bigWin(f,r))return'big';if(t==='conn')return'ribbon';if(b.ribbonTop&&f===b.ribbonTop)return'ribbon';if(b.blankBelow&&f<=b.blankBelow)return'blank';if(t==='storage'||t==='void')return'blank';return'win'}
const GEN={parts:[],plans:{},solar:[],labels:{}};
function genBuilding(b){
  const fl=floorList(b),parts=GEN.parts,P=(o)=>{o.b=b;parts.push(o);return o};
  b.plan={};let bb=[1e9,1e9,-1e9,-1e9],topY=0;
  fl.forEach((f,fi)=>{
    const rooms=b.floors[f],y0=y0Of(b,f),fh=fhOf(b,f),wallTop=y0+fh-SLAB;topY=Math.max(topY,y0+fh);
    const g=grid([rooms]),id=cover(g,rooms);b.plan[f]={rooms,g,id,y0,fh,W:(u,v)=>toW(b,u,v),lx:lxOf(b)};
    rooms.forEach(r=>{const w=wRect(b,r.u0,r.v0,r.u1,r.v1);bb=[Math.min(bb[0],w[0]),Math.min(bb[1],w[1]),Math.max(bb[2],w[2]),Math.max(bb[3],w[3])]});
    const seg=edges(g,id).map(s=>{const ra=s.a>=0?rooms[s.a]:null,rc=s.c>=0?rooms[s.c]:null;
      if(!ra||!rc){const inside=ra||rc;s.kind='ext';s.out=ra?1:-1;s.style=extStyle(b,f,inside.t,inside);return s}
      if(ra.n===rc.n&&ra.t===rc.t)return null;if(OPEN(ra.t)&&OPEN(rc.t))return null;
      if(ra.t==='void'||rc.t==='void'){if(ra.t==='void'&&rc.t==='void')return null;s.kind='rail';return s}
      s.kind='part';s.door=(DOORISH(ra.t)&&!DOORISH(rc.t))||(DOORISH(rc.t)&&!DOORISH(ra.t));return s}).filter(Boolean);
    const ms=merge(seg,s=>s.kind==='ext'?'e'+s.out+s.style:s.kind==='rail'?'r':'p'+Math.min(s.a,s.c)+'_'+Math.max(s.a,s.c));
    ms.forEach(s=>{
      if(s.kind==='ext'){const step=b.bay*2;const cuts=splitLen(s.s0,s.s1,step);
        const big=s.style==='big',e=big?.04:0,top=big?y0+fh:wallTop;   // the dining-hall glass runs through the floor slab
        for(let k=0;k<cuts.length-1;k++){const a=cuts[k],c=cuts[k+1];const w=s.ax==='u'?(s.out>0?[s.at-TW,s.at+e]:[s.at-e,s.at+TW]):null,h=s.ax==='v'?(s.out>0?[s.at-TW,s.at+e]:[s.at-e,s.at+TW]):null;
          const bx=s.ax==='u'?lbox(b,w[0],w[1],a,c,y0,top):lbox(b,a,c,h[0],h[1],y0,top);const n=s.ax==='u'?dirW(b,s.out,0):dirW(b,0,s.out);
          P({...bx,k:'ext',f,m:s.style,nx:n[0],nz:n[1],lu:s.ax==='u'?s.at-s.out*.5:(a+c)/2,lv:s.ax==='u'?(a+c)/2:s.at-s.out*.5,len:c-a})}}
      else if(s.kind==='rail'){const bx=s.ax==='u'?lbox(b,s.at-.05,s.at+.05,s.s0,s.s1,y0,y0+1.1):lbox(b,s.s0,s.s1,s.at-.05,s.at+.05,y0,y0+1.1);P({...bx,k:'rail',f,m:'rail'})}
      else{const L=s.s1-s.s0;let gaps=[];if(s.door&&L>=2.2)gaps=L>=6?[[s.s0+.6,s.s0+1.6],[s.s1-1.6,s.s1-.6]]:[[s.s0+.5,s.s0+1.4]];
        let pieces=[[s.s0,s.s1]];gaps.forEach(([g0,g1])=>{pieces=pieces.flatMap(([a,c])=>g1<=a||g0>=c?[[a,c]]:[[a,g0],[g1,c]].filter(p=>p[1]-p[0]>.05))});
        pieces.forEach(([a,c])=>{const cuts=splitLen(a,c,5);for(let k=0;k<cuts.length-1;k++){const bx=s.ax==='u'?lbox(b,s.at-TP/2,s.at+TP/2,cuts[k],cuts[k+1],y0,wallTop):lbox(b,cuts[k],cuts[k+1],s.at-TP/2,s.at+TP/2,y0,wallTop);P({...bx,k:'part',f,m:'part'})}})}});
    // floor slab (floors above ground)
    if(fi>0){const flag=new Int32Array(id.length);for(let k=0;k<id.length;k++)flag[k]=id[k]>=0&&rooms[id[k]].t!=='void'?1:0;
      rectsOf(g,flag).forEach(r=>{splitLen(r.u0,r.u1,6.5).forEach((a,ia,A)=>{if(ia===A.length-1)return;splitLen(r.v0,r.v1,6.5).forEach((c,ic,C)=>{if(ic===C.length-1)return;
        P({...lbox(b,a,A[ia+1],c,C[ic+1],y0-SLAB,y0),k:'slab',f,m:'slab'})})})})}
